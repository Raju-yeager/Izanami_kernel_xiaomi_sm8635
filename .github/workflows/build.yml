# ============================================================================
#  Kernel CI | POCO F6 / Redmi Turbo 3 (peridot, SM8635) | KernelSU-Next + SUSFS
#
#  Save as  .github/workflows/build.yml  in a repo of yours. A fork is NOT needed: the kernel is
#  checked out straight from KERNEL_REPO, so every run tracks the dev's latest commits.
#  Optional: put *.patch files in a  patches/  folder of your repo; they are applied to the kernel.
#  Repo secrets (Settings > Secrets and variables > Actions):
#      TG_BOT_TOKEN   bot token from @BotFather
#      TG_CHAT_ID     channel id like -1001234567890 (bot must be channel admin)
#  Everything you normally tweak is in the CONFIG block below.
#
#  How it behaves:
#   * Runs weekly (and on demand). It resolves the latest commits of your kernel,
#     KernelSU-Next and SUSFS and hashes them. If a release for that exact hash
#     already exists, it stops in ~20 seconds. No new upstream commits = no build.
#   * On a build: integrates KSU-Next + SUSFS, builds Image, packs an AnyKernel3
#     zip, publishes a GitHub Release and sends the zip to Telegram.
# ============================================================================
name: Kernel CI

on:
  schedule:
    - cron: "0 3 * * 1"            # weekly, Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if nothing changed since the last release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kernel-ci
  cancel-in-progress: false

env:
  # ------------------------------ CONFIG -------------------------------------
  NAME: "Izanami"                  # zip / release name
  KERNEL_REPO: "khargosxh18/android_kernel_xiaomi_sm8635"   # built directly = always the dev's latest
  KERNEL_BRANCH: "17"              # Android 17 branch (matches Infinity X v4.0)
  KERNEL_REF: ""                   # optional: pin an exact commit SHA (empty = latest of KERNEL_BRANCH)
  LOCALVERSION: "-Izanami"         # kernel name -> uname -r = 6.1.x-Izanami+ ; "" keeps the dev's -Vibranium-V18
  DEFCONFIG: "gki_defconfig"
  FRAGMENTS: "vendor/pineapple_GKI.config vendor/peridot_GKI.config"  # space separated, "" for none
  CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz"
  KSU_REPO: "https://github.com/pershoot/KernelSU-Next"
  KSU_BRANCH: "dev-susfs"
  SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
  SUSFS_BRANCH: "gki-android14-6.1"
  SWAP_GB: "10"
  # ----------------------------------------------------------------------------

jobs:
  # --------------------------------------------------------------------------
  # Cheap gate: decide whether anything changed since the last release
  # --------------------------------------------------------------------------
  check:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.fp.outputs.build }}
      tag: ${{ steps.fp.outputs.tag }}
    steps:
      - id: fp
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -n "$KERNEL_BRANCH" ]; then ref="refs/heads/$KERNEL_BRANCH"; else ref="HEAD"; fi
          K=$(git ls-remote "https://github.com/${KERNEL_REPO}.git" "$ref" | head -1 | cut -f1)
          if [ -n "$KERNEL_REF" ]; then K="$KERNEL_REF"; fi
          S=$(git ls-remote "$KSU_REPO" "refs/heads/$KSU_BRANCH" | head -1 | cut -f1)
          F=$(git ls-remote "$SUSFS_REPO" "refs/heads/$SUSFS_BRANCH" | head -1 | cut -f1)
          if [ -z "$K" ] || [ -z "$S" ] || [ -z "$F" ]; then
            echo "::error::could not resolve a ref (kernel=$K ksu=$S susfs=$F)"; exit 1
          fi
          FP=$(printf '%s' "$K$S$F$CLANG_URL$DEFCONFIG$FRAGMENTS$LOCALVERSION" | sha256sum | cut -c1-10)
          TAG="ci-$FP"
          if gh release view "$TAG" >/dev/null 2>&1 && [ "$FORCE" != "true" ]; then
            BUILD=false
            echo "Nothing new (release $TAG exists). Skipping."
          else
            BUILD=true
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.check.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # ---- RAM / disk: free space and add swap so LTO linking never OOMs ----
      - name: Free disk and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l "${SWAP_GB}G" /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          df -h / /mnt; free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev cpio zip lz4 zstd \
            xz-utils python3 dwarves ccache \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Checkout this repo (for optional patches/)
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          path: kernel
          ref: ${{ env.KERNEL_REF || env.KERNEL_BRANCH }}
          fetch-depth: 1

      - name: Apply your patches (optional)
        working-directory: kernel
        run: |
          shopt -s nullglob
          for p in ../ci/patches/*.patch; do
            echo "Applying $p"
            patch -p1 --no-backup-if-mismatch < "$p"
          done

      - name: Cache clang
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: clang-${{ env.CLANG_URL }}

      - name: Download clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/clang
          curl -fL --retry 5 --retry-delay 5 "$CLANG_URL" | tar -xz -C ~/clang

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-kernel
          max-size: 4G

      - name: Show toolchain
        run: |
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version | head -1

      # ---- KernelSU-Next (full clone: its version number comes from git history) ----
      - name: Integrate KernelSU-Next
        working-directory: kernel
        run: |
          set -euo pipefail
          rm -rf KernelSU-Next
          git clone --branch "$KSU_BRANCH" "$KSU_REPO" KernelSU-Next
          if [ -e drivers/kernelsu ]; then echo "Tree already ships kernelsu, replacing it"; rm -rf drivers/kernelsu; fi
          ln -sfn ../KernelSU-Next/kernel drivers/kernelsu
          grep -q kernelsu drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q kernelsu drivers/Kconfig  || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          echo "KSU_SHA=$(git -C KernelSU-Next rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "KSU_COUNT=$(git -C KernelSU-Next rev-list --count HEAD)" >> "$GITHUB_ENV"

      # ---- SUSFS ----
      - name: Integrate SUSFS
        working-directory: kernel
        run: |
          set -euo pipefail
          rm -rf susfs4ksu
          git clone --depth=1 --branch "$SUSFS_BRANCH" "$SUSFS_REPO" susfs4ksu
          echo "SUSFS_SHA=$(git -C susfs4ksu rev-parse --short HEAD)" >> "$GITHUB_ENV"
          if [ -f fs/susfs.c ]; then
            echo "::warning::Tree already contains SUSFS (fs/susfs.c); skipping patch step"
            exit 0
          fi
          cp -v susfs4ksu/kernel_patches/fs/*            fs/
          cp -v susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 -F3 --no-backup-if-mismatch < susfs4ksu/kernel_patches/50_add_susfs_in_*.patch || {
            echo "::error::SUSFS patch has rejects. Fix them once by hand in your fork, commit, and re-run."
            find . -name '*.rej' -print -exec head -40 {} \;
            exit 1
          }

      # ---- Build ----
      - name: Build kernel
        working-directory: kernel
        run: |
          set -euo pipefail
          export PATH="$HOME/clang/bin:$PATH"
          export CCACHE_COMPILERCHECK=content

          # Fix glibc 2.43+ C23 const-qualifier error in libbpf / resolve_btfids host tool
          sed -i 's/char \*next_path;/const char *next_path;/g' tools/lib/bpf/libbpf.c || true
          sed -i 's/-Werror//g' tools/lib/bpf/Makefile tools/bpf/resolve_btfids/Makefile || true

          MK="make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
              CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
              KBUILD_BUILD_USER=ci KBUILD_BUILD_HOST=github"

          for f in "$DEFCONFIG" $FRAGMENTS; do
            [ -f "arch/arm64/configs/$f" ] || {
              echo "::error::arch/arm64/configs/$f not found. Available:"
              ls arch/arm64/configs arch/arm64/configs/vendor 2>/dev/null | head -60
              exit 1
            }
          done
          $MK $DEFCONFIG $FRAGMENTS

          # Kernel name. (peridot_GKI.config already has LOCALVERSION_AUTO=n, so a "+" is appended.)
          if [ -n "$LOCALVERSION" ]; then
            scripts/config --file out/.config --set-str LOCALVERSION "$LOCALVERSION"
          fi

          # Only KernelSU + SUSFS are added. Everything else (NetHunter, LTO, ...) stays as the repo has it.
          scripts/config --file out/.config \
            -e KSU -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS \
            -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_SUS_MAP -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_OPEN_REDIRECT -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          $MK olddefconfig
          grep -E '^CONFIG_(KSU|KSU_SUSFS[A-Z_]*)=' out/.config || true

          $MK CC="ccache clang" Image
          ls -l out/arch/arm64/boot/Image
          KREL="$(cat out/include/config/kernel.release)"
          echo "KREL=$KREL" >> "$GITHUB_ENV"
          echo "Built kernel release: $KREL"
          ccache -s | head -8

      # ---- Package ----
      - name: Pack AnyKernel3 zip
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/LICENSE ak3/modules ak3/patch ak3/ramdisk
          cp kernel/out/arch/arm64/boot/Image ak3/Image
          cat > ak3/anykernel.sh <<'EOF'
          ### AnyKernel3 script (kernel-only, boot partition, A/B)
          properties() { '
          kernel.string=Izanami kernel + KernelSU-Next + SUSFS (peridot)
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=peridot
          device.name2=fox_peridot
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }
          block=boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          no_block_display=1;
          . tools/ak3-core.sh;
          # GKI devices keep the ramdisk in init_boot: skip ramdisk unpack/repack there
          # (dump_boot/write_boot on an empty boot ramdisk is what causes "ramdisk" errors).
          if [ -L /dev/block/bootdevice/by-name/init_boot_a ] || [ -L /dev/block/by-name/init_boot_a ] \
             || [ -L /dev/block/bootdevice/by-name/init_boot ] || [ -L /dev/block/by-name/init_boot ]; then
            split_boot;
            flash_boot;
          else
            dump_boot;
            write_boot;
          fi
          EOF
          sed -i 's/^          //' ak3/anykernel.sh
          ZIP="${NAME}-${KREL%%-*}-KSUN${KSU_COUNT}-SUSFS-$(date -u +%Y%m%d).zip"
          (cd ak3 && zip -r9 "../$ZIP" . -x '.git*')
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          cat > notes.md <<EOF
          Automated build for peridot (POCO F6 / Redmi Turbo 3)

          - Kernel release: \`${KREL}\`
          - Kernel commit: \`$(git -C kernel rev-parse --short HEAD)\` (${KERNEL_REPO}@${KERNEL_BRANCH})
          - KernelSU-Next: \`${KSU_SHA}\` (${KSU_REPO#https://github.com/} @ ${KSU_BRANCH})
          - SUSFS: \`${SUSFS_SHA}\` (${SUSFS_BRANCH})

          Flash the zip from recovery or a kernel flasher, then install the matching KernelSU-Next manager.
          Back up your current boot.img before flashing.
          If touch/wifi are dead afterwards, check \`dmesg | grep -iE 'disagrees about version|version magic'\`:
          that means the module version check rejected the kernel name; set LOCALVERSION to "" in build.yml and rebuild.
          EOF
          sed -i 's/^          //' notes.md

      - name: Publish GitHub Release
        run: |
          gh release create "$TAG" "$ZIP" \
            --title "${NAME} ${KREL} | KSUN ${KSU_COUNT} | $(date -u +%Y-%m-%d)" \
            --notes-file notes.md

      - name: Send to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "Telegram secrets not set, skipping"; exit 0
          fi
          CAPTION="<b>${NAME}</b> kernel build
          Kernel: <code>${KREL}</code>
          KSU-Next: <code>${KSU_SHA}</code> | SUSFS: <code>${SUSFS_SHA}</code>"
          curl -fsS -o /dev/null \
            -F chat_id="$TG_CHAT_ID" -F parse_mode=HTML \
            -F caption="$CAPTION" -F document=@"$ZIP" \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument"

      - name: Telegram failure notice
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          [ -n "${TG_BOT_TOKEN:-}" ] && [ -n "${TG_CHAT_ID:-}" ] || exit 0
          curl -fsS -o /dev/null "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT_ID" \
            --data-urlencode text="Kernel build failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
